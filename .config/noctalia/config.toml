[theme]
mode = "dark"
source = "builtin"
builtin = "Catppuccin"

[shell]
# Set font for Noctalia's shell UI.
font_family = "Adwaita Sans"

# Disable the clipboard manager entirely.
clipboard_enabled = false

# 1Password system authentication and CLI integration require a Polkit agent.
polkit_agent = true

[control_center.calendar]
show_week_numbers = true

[shell.launcher]
categories = false
compact = true
pinned = [
  "org.mozilla.firefox",
  "kitty",
  "dev.zed.Zed",
  "org.gnome.Nautilus",
  "md.obsidian.Obsidian",
  "com.onepassword.OnePassword",
  "code",
]

[shell.launcher.providers.calculator]
# Disable calculator results during search.
global = false

[bar.main]
# Use the full width of each monitor instead of inset end margins.
margin_ends = 0
margin_edge = 0
shadow = false
concave_edge_corners = false
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0

start = ["workspaces"]
center = ["clock"]

# Omit clipboard + MPRIS/"Now Playing" widget.
end = [
  "tray",
  "notifications",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]

# Show date and time in the bar center; full date on hover.
[widget.clock]
format = "{:%a %d %b  %H:%M}"
tooltip_format = "{:%A, %B %d, %Y}"

# Only show workspace navigation on the side monitors.
[bar.main.monitor.dp2]
match = "DP-2"
start = ["workspaces"]
center = []
end = []

[bar.main.monitor.dp3]
match = "DP-3"
start = ["workspaces"]
center = []
end = []

[hooks]
# 1Password UI does not support Niri's auto-lock backend, so lock it explicitly.
session_locked = """
  if pgrep -x 1password >/dev/null; then
    1password --lock >/dev/null 2>&1
  fi
"""

# Only show the lock screen on the primary monitor.
[lockscreen]
monitors = ["DP-1"]

# Noctalia re-arms idle timers after locking. `timeout` applies before locking, while
# `locked_timeout` applies after locking.
# Intended totals from last input: lock at 5m, monitor-off at 10m, and suspend at 20m.
[idle]
behavior_order = ["lock", "screen-off", "suspend"]

# Lock the session after 5m without input.
[idle.behavior.lock]
timeout = 300
action = "lock"
enabled = true

# Turn the monitors off after 10m total: 5m after locking.
[idle.behavior.screen-off]
timeout = 600
locked_timeout = 300
action = "screen_off"
enabled = true

# Suspend after 20m total: 15m after locking.
[idle.behavior.suspend]
timeout = 1200
locked_timeout = 900
action = "lock_and_suspend"
enabled = true
