gui:
  mouseEvents: false
  showRandomTip: false
  showCommandLog: false
  showBottomLine: true
  showFileIcons: true
  nerdFontsVersion: "3"
  language: "auto"
  filterMode: fuzzy
  timeFormat: "2006-01-02 15:04"

  # Catpuccin Mocha theme
  # See https://github.com/catppuccin/lazygit
  theme:
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#cba6f7"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
  authorColors:
    "*": "#b4befe"

git:
  autoFetch: true
  autoRefresh: true
  autoForwardBranches: onlyMainBranches
  parseEmoji: true
  skipHookPrefix: "wip"

  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false

  commit:
    signOff: false
    autoWrapCommitMessage: true

  merging:
    manualCommit: false

  pagers:
    - colorArg: always
      pager: "delta --paging=never"

  branchLogCmd: "git log --color=always --graph --decorate --oneline {{branchName}} --"

os:
  edit: "$EDITOR {{filename}}"
  editAtLine: "$EDITOR +{{line}} {{filename}}"
  editAtLineAndWait: ""
  editInTerminal: true
  openDirInEditor: "$EDITOR {{dir}}"

# Skip prompt asking to create a new repo
notARepository: skip

confirmOnQuit: false
quitOnTopLevelReturn: false
disableStartupPopups: true
promptToReturnFromSubprocess: true

customCommands:
  - key: "<c-p>"
    context: "localBranches"
    description: "Open PR in browser"
    command: "gh pr view --web {{.SelectedLocalBranch.Name}}"
  - key: "<c-n>"
    context: "localBranches"
    description: "Create PR"
    command: "gh pr create --web"
  - key: "<c-s>"
    context: "localBranches"
    description: "View PR status"
    command: "gh pr status"
    output: terminal
  - key: "<c-k>"
    context: "localBranches"
    description: "View PR checks"
    command: "gh pr checks {{.SelectedLocalBranch.Name}}"
    output: terminal
