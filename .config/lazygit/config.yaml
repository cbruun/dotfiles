gui:
  showRandomTip: false
  showCommandLog: false
  showBottomLine: true
  showFileIcons: true
  nerdFontsVersion: "3"
  language: "auto"
  theme:
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#cba6f7"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
  authorColors:
    "*": "#b4befe"
  timeFormat: "2006-01-02 15:04"

git:
  autoFetch: true
  autoRefresh: true
  autoForwardBranches: onlyMainBranches
  parseEmoji: true

  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false

  commit:
    signOff: false
    autoWrapCommitMessage: true
  merging:
    manualCommit: false
  paging:
    colorArg: always
    pager: ""
  branchLogCmd: "git log --color=always --graph --decorate --oneline {{branchName}} --"

os:
  edit: "$EDITOR {{filename}}"
  editAtLine: "$EDITOR +{{line}} {{filename}}"
  editAtLineAndWait: ""
  editInTerminal: true
  openDirInEditor: "$EDITOR {{dir}}"

# Skip prompt asking to create a new repo
notARepository: skip

confirmOnQuit: false
quitOnTopLevelReturn: false
disableStartupPopups: true
promptToReturnFromSubprocess: true
